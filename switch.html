<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Website Version Nº</title>
  <link rel="stylesheet" href="/css/styles.css?v=20260611-info-reveal-color-test-2" />
  <style>
    body {
      display: grid;
      height: 100vh;
      height: 100dvh;
      place-items: center;
      overflow: hidden;
      padding: 24px;
    }

    .mode-switcher {
      display: grid;
      grid-template-columns: repeat(2, 35vw);
      grid-template-rows: auto minmax(0, 1fr);
      gap: 24px;
      justify-content: center;
      align-items: center;
      width: 100%;
      height: min(720px, calc(100dvh - 48px));
    }

    .mode-switcher h1 {
      grid-column: 1 / -1;
      margin: 0;
      font-size: 20px;
      line-height: 1.1;
    }

    .mode-switcher button {
      display: grid;
      grid-template-rows: auto 1fr;
      gap: 24px;
      align-items: center;
      width: 35vw;
      height: 50vh;
      min-height: 0;
      padding: 24px;
      border: 1px solid currentColor;
      border-radius: 8px;
      color: inherit;
      background: transparent;
      font-size: 24px;
      font-weight: 700;
      text-align: left;
      cursor: pointer;
    }

    .mode-switcher img {
      align-self: center;
      justify-self: center;
      width: min(96px, 28%);
      height: auto;
    }

    .mode-switcher button:hover,
    .mode-switcher button:focus-visible {
      background: #fff;
    }

    @media (max-width: 700px) {
      .mode-switcher {
        grid-template-columns: minmax(0, 1fr);
        grid-template-rows: auto repeat(2, minmax(0, 1fr));
      }

      .mode-switcher button {
        width: 100%;
        min-height: 0;
      }
    }
  </style>
</head>
<body>
  <main class="mode-switcher" aria-labelledby="modeSwitcherTitle">
    <h1 id="modeSwitcherTitle">Supergroup Website Version Nº</h1>
    <button type="button" data-site-mode="temporary">
      <span>Temporary website Nº 1</span>
      <img src="/assets/supergroup/favicon-light.svg" alt="" />
    </button>
    <button type="button" data-site-mode="full">
      <span>Full slideshow website</span>
      <img src="/assets/supergroup/favicon-light.svg" alt="" />
    </button>
  </main>

  <script>
    document.querySelectorAll("[data-site-mode]").forEach((button) => {
      button.addEventListener("click", () => {
        const mode = button.dataset.siteMode;
        window.localStorage.setItem("siteMode", mode);
        window.open(`/index.html?mode=${mode}`, "_blank", "noopener");
      });
    });
  </script>
</body>
</html>

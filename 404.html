<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Redirecting to Supergroup</title>
  <script>
    try {
      sessionStorage.setItem("supergroupRedirectPath", window.location.pathname + window.location.search + window.location.hash);
    } catch (error) {
      // Continue with a plain redirect when sessionStorage is unavailable.
    }
    window.location.replace("/");
  </script>
</head>

<body>
  <p>
    Redirecting to <a href="/">Supergroup</a>.
  </p>
</body>
</html>
